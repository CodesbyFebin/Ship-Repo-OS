name: Feature request
description: Propose an improvement to ShipOS
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected workflow
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Desired outcome and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
