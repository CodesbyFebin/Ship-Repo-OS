name: Package and publish ShipOS
on:
  push:
    branches: [main]
    paths: [docs/releases/v1.1.0.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shipos-release
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'CodesbyFebin/Ship-Repo-OS' && (github.event_name == 'push' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify release version and notes
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$tag" == v1.1.0 ]]
          else
            [[ "$GITHUB_REF_NAME" == "$tag" ]]
          fi
          test -s "docs/releases/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install, test, and build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm exec --yes --package bun@1.3.4 -- bun install --frozen-lockfile
          npm run db:generate
          npm test
          npm run build
      - name: Package and smoke-test the archive
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash scripts/package-release.sh "$RUNNER_TEMP/shipos-release"
          package="$RUNNER_TEMP/shipos-release"
          cp "docs/releases/$RELEASE_TAG.md" "$package/release-notes.md"
          (cd "$package" && sha256sum -c SHA256SUMS.txt)
          smoke=$(mktemp -d)
          name="ShipOS-$RELEASE_TAG-linux-x64"
          tar -xzf "$package/$name.tar.gz" -C "$smoke"
          PORT=3211 SHIPOS_DATA_DIR="$smoke/state" "$smoke/$name/start.sh" > "$smoke/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$smoke/server.log"; rm -rf "$smoke"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3211/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3211/api/projects | node -e '
            const body = require("node:fs").readFileSync(0, "utf8");
            if (!Array.isArray(JSON.parse(body)) || JSON.parse(body).length !== 0) process.exit(1);'
          test -s "$smoke/state/shipos.db"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shipos-release
          path: ${{ runner.temp }}/shipos-release/
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shipos-release
          path: release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          if target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            [[ "$target" == "$GITHUB_SHA" ]] || { echo "The existing tag points to another commit." >&2; exit 1; }
          fi
          marker="<!-- shipos-release-build: $GITHUB_SHA -->"
          if existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,body 2>/dev/null); then
            if [[ "$(jq -r .isDraft <<< "$existing")" == false ]]; then
              echo "The release is already published."
              exit 0
            fi
            [[ "$(jq -r .targetCommitish <<< "$existing")" == "$GITHUB_SHA" && "$(jq -r .body <<< "$existing")" == *"$marker"* ]] || {
              echo "An unrelated release draft already exists. Leaving it for review." >&2; exit 1;
            }
          else
            printf '\n%s\n' "$marker" >> release-notes.md
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "ShipOS $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "ShipOS-$RELEASE_TAG-linux-x64.tar.gz" SHA256SUMS.txt ShipOS-teaser.mp4 ShipOS-teaser.vtt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
