name: Repository checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Cache Bun downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.4-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: npm exec --yes --package bun@1.3.4 -- bun install --frozen-lockfile
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Test Workbench with coverage
        run: npm run test:coverage
      - name: Lint Workbench
        run: npm run lint:workbench
      - name: Check types
        run: npm run typecheck
      - name: Build production bundle
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: file:./db/ci.db
        run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start app with a fresh SQLite volume
        run: docker compose up --build --wait --wait-timeout 90
      - name: Verify database-backed endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:3000/api/projects
      - name: Stop smoke-test services
        if: always()
        run: docker compose down
